---
name: 镜像冒烟测试

# 对已发布的 all-in-one 镜像做端到端验证：冷启动、健康检查、静态资源缓存、
# 重启后跳过内置数据导入、内存占用。发布后手动触发即可，不影响发布流程。

on:
  workflow_dispatch:
    inputs:
      image:
        description: '镜像名（含命名空间）'
        required: true
        default: 'benxianyu/apitable-new'
      tag:
        description: '标签'
        required: true
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: image-smoke-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  smoke:
    name: 冒烟 ${{ github.event.inputs.image }}:${{ github.event.inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 拉取镜像
        env:
          IMAGE: ${{ github.event.inputs.image }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}:${TAG}"
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: 采集各组件镜像体积
        if: always()
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -uo pipefail
          for repo in apitable-new apitable-room-server apitable-web-server \
                      apitable-backend-server apitable-init-db apitable-openresty \
                      apitable-databus-server apitable-dataenv-pm2; do
            if docker pull -q "benxianyu/${repo}:${TAG}" >/dev/null 2>&1; then :; fi
          done
          echo '### 镜像体积' >> "$GITHUB_STEP_SUMMARY"
          echo '| 镜像 | 体积 |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          docker images --filter "reference=benxianyu/*:${TAG}" \
            --format '{{.Repository}}|{{.Size}}' | sort | while IFS='|' read -r r s; do
              echo "| ${r#benxianyu/} | ${s} |" >> "$GITHUB_STEP_SUMMARY"
              printf '%-40s %s\n' "${r}" "${s}"
            done

      - name: 运行冒烟脚本
        id: smoke
        env:
          IMAGE: ${{ github.event.inputs.image }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -uo pipefail
          chmod +x scripts/smoke-test.sh
          scripts/smoke-test.sh "${IMAGE}:${TAG}" "${GITHUB_WORKSPACE}/.smoke-data" 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: 失败时导出容器日志
        if: failure()
        run: |
          set +e
          for c in $(docker ps -a --filter "name=apitable-smoke" --format '{{.Names}}'); do
            echo "===== $c ====="
            docker logs --tail 200 "$c"
          done

      - name: 上传冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ github.event.inputs.tag }}
          path: smoke.log
          if-no-files-found: warn

---
name: 镜像内命令

# 在镜像里执行一条命令并打印结果，用于排查运行时缺失的文件/依赖/版本。
on:
  workflow_dispatch:
    inputs:
      image:
        description: '镜像名（含命名空间）'
        required: true
        default: 'benxianyu/apitable-new'
      tag:
        description: '标签'
        required: true
        default: 'latest'
      command:
        description: '要执行的 shell 命令'
        required: true
        default: 'node -v; which node; ls /app'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 拉取镜像
        env:
          IMAGE: ${{ github.event.inputs.image }}
          TAG: ${{ github.event.inputs.tag }}
        run: docker pull "${IMAGE}:${TAG}"

      - name: 执行命令
        env:
          IMAGE: ${{ github.event.inputs.image }}
          TAG: ${{ github.event.inputs.tag }}
          CMD: ${{ github.event.inputs.command }}
        run: |
          set -uo pipefail
          docker run --rm --entrypoint sh "${IMAGE}:${TAG}" -c "${CMD}" 2>&1 | tee out.txt

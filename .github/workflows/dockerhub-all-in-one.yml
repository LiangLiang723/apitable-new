name: 构建并推送自定义 APITable all-in-one 镜像

on:
  push:
    branches:
      - self-hosted-enterprise
      - 'v*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image:
        description: '最终 all-in-one 镜像名'
        required: false
        default: 'benxianyu/apitable-new'
      push_latest:
        description: '是否同时推送 latest 标签'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: dockerhub-all-in-one-${{ github.ref }}
  cancel-in-progress: true

env:
  FINAL_IMAGE: benxianyu/apitable-new
  BACKEND_IMAGE: benxianyu/apitable-backend-server
  ROOM_IMAGE: benxianyu/apitable-room-server
  WEB_IMAGE: benxianyu/apitable-web-server
  ALL_IN_ONE_DOCKERFILE: packaging/all-in-one/all-in-one/Dockerfile

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 解析镜像标签
        id: vars
        shell: bash
        env:
          INPUT_IMAGE: ${{ github.event.inputs.image }}
          INPUT_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
        run: |
          set -euo pipefail

          image="${INPUT_IMAGE:-}"
          if [[ -z "${image}" ]]; then
            image="${FINAL_IMAGE}"
          fi

          ref_name="${GITHUB_REF_NAME}"
          version_tag="${ref_name//\//-}"
          short_sha="${GITHUB_SHA::12}"

          # 普通分支构建时加短 SHA，避免覆盖正式版本。
          # v3.0.0 这类版本分支或 tag 保持原样，只推 v3.0.0，不推 3.0.0。
          if [[ "${GITHUB_REF_TYPE}" == "branch" && ! "${version_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-._A-Za-z0-9]+)?$ ]]; then
            version_tag="${version_tag}-${short_sha}"
          fi

          push_latest="true"
          if [[ -n "${INPUT_PUSH_LATEST:-}" ]]; then
            push_latest="${INPUT_PUSH_LATEST}"
          fi

          echo "final_image=${image}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${push_latest}" >> "$GITHUB_OUTPUT"

          echo "最终镜像: ${image}"
          echo "版本标签: ${version_tag}"
          echo "短 SHA: ${short_sha}"
          echo "推送 latest: ${push_latest}"

      - name: 校验 all-in-one Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          test -f "${ALL_IN_ONE_DOCKERFILE}"
          echo "使用 Dockerfile: ${ALL_IN_ONE_DOCKERFILE}"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建本地 all-in-one 基础镜像
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -f packaging/all-in-one/dataenv-pm2/Dockerfile \
            -t apitable/dataenv-pm2:latest \
            packaging/all-in-one/dataenv-pm2

          docker build \
            -f packaging/all-in-one/dataenv-liquibase-pm2/Dockerfile \
            -t apitable/dataenv-liquibase-pm2:latest \
            packaging/all-in-one/dataenv-liquibase-pm2

      - name: 构建 backend-server 镜像
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.version_tag }}"

          docker build \
            -f packaging/Dockerfile.backend-server \
            --build-arg SEMVER_FULL="${tag}" \
            -t apitable/backend-server:"${tag}" \
            -t "${BACKEND_IMAGE}:${tag}" \
            -t "${BACKEND_IMAGE}:${{ steps.vars.outputs.short_sha }}" \
            -t "${BACKEND_IMAGE}:latest" \
            .

      - name: 构建 room-server 镜像
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.version_tag }}"

          docker build \
            -f packaging/Dockerfile.room-server \
            --build-arg SEMVER_FULL="${tag}" \
            -t apitable/room-server:"${tag}" \
            -t "${ROOM_IMAGE}:${tag}" \
            -t "${ROOM_IMAGE}:${{ steps.vars.outputs.short_sha }}" \
            -t "${ROOM_IMAGE}:latest" \
            .

      - name: 构建 web-server 镜像
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.version_tag }}"

          docker build \
            -f packaging/Dockerfile.web-server \
            --build-arg SEMVER_FULL="${tag}" \
            -t apitable/web-server:"${tag}" \
            -t "${WEB_IMAGE}:${tag}" \
            -t "${WEB_IMAGE}:${{ steps.vars.outputs.short_sha }}" \
            -t "${WEB_IMAGE}:latest" \
            .

      - name: 构建 init-db 本地镜像
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.version_tag }}"

          docker build \
            -f init-db/Dockerfile \
            --build-arg SEMVER_FULL="${tag}" \
            -t apitable/init-db:"${tag}" \
            ./init-db

      - name: 构建最终 all-in-one 镜像
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.version_tag }}"
          short_sha="${{ steps.vars.outputs.short_sha }}"
          final_image="${{ steps.vars.outputs.final_image }}"

          docker build \
            -f "${ALL_IN_ONE_DOCKERFILE}" \
            --build-arg IMAGE_TAG="${tag}" \
            --build-arg SEMVER_FULL="${tag}" \
            -t "${final_image}:${tag}" \
            -t "${final_image}:${short_sha}" \
            .

          if [[ "${{ steps.vars.outputs.push_latest }}" == "true" ]]; then
            docker tag "${final_image}:${tag}" "${final_image}:latest"
          fi

      - name: 推送组件镜像到 Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.version_tag }}"
          short_sha="${{ steps.vars.outputs.short_sha }}"

          for image in "${BACKEND_IMAGE}" "${ROOM_IMAGE}" "${WEB_IMAGE}"; do
            docker push "${image}:${tag}"
            docker push "${image}:${short_sha}"
            if [[ "${{ steps.vars.outputs.push_latest }}" == "true" ]]; then
              docker push "${image}:latest"
            fi
          done

      - name: 推送最终 all-in-one 镜像到 Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.version_tag }}"
          short_sha="${{ steps.vars.outputs.short_sha }}"
          final_image="${{ steps.vars.outputs.final_image }}"

          docker push "${final_image}:${tag}"
          docker push "${final_image}:${short_sha}"
          if [[ "${{ steps.vars.outputs.push_latest }}" == "true" ]]; then
            docker push "${final_image}:latest"
          fi

      - name: 输出结果
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Docker Hub 推送完成

          最终 all-in-one 镜像：

          \`\`\`bash
          docker pull ${{ steps.vars.outputs.final_image }}:${{ steps.vars.outputs.version_tag }}
          docker pull ${{ steps.vars.outputs.final_image }}:${{ steps.vars.outputs.short_sha }}
          docker pull ${{ steps.vars.outputs.final_image }}:latest
          \`\`\`

          组件镜像：

          \`\`\`text
          ${BACKEND_IMAGE}:${{ steps.vars.outputs.version_tag }}
          ${ROOM_IMAGE}:${{ steps.vars.outputs.version_tag }}
          ${WEB_IMAGE}:${{ steps.vars.outputs.version_tag }}
          \`\`\`
          EOF
